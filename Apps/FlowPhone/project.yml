name: FlowPhone
options:
  bundleIdPrefix: studio.alexsdop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BiomechanicsCore:
    path: ../../Packages/BiomechanicsCore
targets:
  FlowPhone:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BiomechanicsCore
        product: BiomechanicsCore
      - package: BiomechanicsCore
        product: FlowUI
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "1"
        NSMotionUsageDescription: Flow reads AirPods head motion and, at the gym, the iPhone in your pocket to judge posture and technique. Nothing leaves the device.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.alexsdop.FlowPhone
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
